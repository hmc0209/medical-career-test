<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医療キャリア適性チェック｜姫路医療専門学校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-dark: #0369a1;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: #334155;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .progress-bar {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scale-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .scale-btn:active {
            transform: scale(0.9);
        }
        .char-svg {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }
        .result-card {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        /* スケールボタンのカスタム色 */
        .btn-agree { background-color: #f0f9ff; border-color: #7dd3fc; }
        .btn-agree:hover { background-color: #bae6fd; }
        .btn-neutral { background-color: #f8fafc; border-color: #e2e8f0; }
        .btn-disagree { background-color: #fcfcfc; border-color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-md w-full glass-card rounded-[2.5rem] shadow-2xl overflow-hidden relative border border-white/50">
        
        <!-- Start Screen -->
        <div id="start-screen" class="p-10 text-center">
            <div class="mb-8">
                <span class="inline-block bg-sky-100 text-sky-700 px-4 py-1.5 rounded-full text-xs font-bold tracking-widest mb-4">HIMEJI MEDICAL COLLEGE</span>
                <h1 class="text-4xl font-black text-slate-800 leading-tight tracking-tighter">
                    医療キャリア<br><span class="text-sky-500 underline decoration-sky-200 decoration-8 underline-offset-4">適性チェック</span>
                </h1>
            </div>
            
            <div class="relative mb-10 group">
                <div class="absolute inset-0 bg-sky-400 rounded-3xl blur-2xl opacity-10 group-hover:opacity-20 transition-opacity"></div>
                <div class="relative bg-white rounded-[2rem] p-8 shadow-sm border border-sky-50">
                    <div class="text-6xl mb-4 animate-bounce">🩺</div>
                    <p class="text-slate-600 leading-loose font-medium text-sm">
                        直感で答えるだけの10問！<br>
                        あなたの中に眠る「医療職としての才能」と<br>
                        <span class="text-slate-800 font-bold">未来の自分</span>を見つけにいこう。
                    </p>
                </div>
            </div>

            <button onclick="startQuiz()" class="w-full bg-gradient-to-br from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold py-5 rounded-2xl shadow-lg shadow-sky-200 transition-all duration-300 transform hover:-translate-y-1 active:scale-95 text-lg">
                診断をはじめる
            </button>
            <p class="text-slate-400 text-[10px] mt-6 tracking-widest">所要時間：約1分</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="bg-slate-100 h-1.5 w-full">
                <div id="progress" class="progress-bar bg-sky-500 h-1.5 w-0"></div>
            </div>
            <div class="p-8">
                <div class="flex justify-between items-center mb-10">
                    <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 flex items-center text-xs font-bold transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        PREV
                    </button>
                    <div class="px-4 py-1.5 bg-slate-800 rounded-full">
                        <span id="question-number" class="text-white font-mono text-xs">Q.01 / 10</span>
                    </div>
                </div>
                
                <div class="min-h-[140px] flex items-center justify-center mb-12">
                    <h2 id="question-text" class="text-xl font-bold text-slate-800 text-center leading-relaxed">
                        質問内容
                    </h2>
                </div>

                <!-- 5段階評価 UI -->
                <div class="space-y-8">
                    <div class="flex items-center justify-between w-full relative">
                        <!-- Connecting Line -->
                        <div class="absolute top-1/2 left-0 w-full h-[2px] bg-slate-100 -z-10"></div>
                        
                        <div class="text-center w-12">
                            <span class="text-[10px] font-black text-sky-500 block mb-2">強く思う</span>
                            <button onclick="handleAnswer(2)" class="scale-btn mx-auto w-12 h-12 border-4 border-sky-400 rounded-full bg-white shadow-md active:bg-sky-50"></button>
                        </div>
                        <button onclick="handleAnswer(1)" class="scale-btn w-9 h-9 border-4 border-sky-200 rounded-full bg-white shadow-sm active:bg-sky-50"></button>
                        <button onclick="handleAnswer(0)" class="scale-btn w-7 h-7 border-4 border-slate-200 rounded-full bg-white shadow-sm active:bg-slate-50"></button>
                        <button onclick="handleAnswer(-1)" class="scale-btn w-9 h-9 border-4 border-slate-200 rounded-full bg-white shadow-sm active:bg-slate-50"></button>
                        <div class="text-center w-12">
                            <span class="text-[10px] font-black text-slate-400 block mb-2">思わない</span>
                            <button onclick="handleAnswer(-2)" class="scale-btn mx-auto w-12 h-12 border-4 border-slate-300 rounded-full bg-white shadow-md active:bg-slate-50"></button>
                        </div>
                    </div>
                    <p class="text-center text-[10px] text-slate-400 font-bold tracking-widest uppercase">Tap to Answer</p>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-8 fade-in text-center pb-12">
            <header class="mb-8">
                <span class="text-sky-500 font-black text-xs tracking-widest uppercase mb-2 block">Your Analysis Result</span>
                <h2 class="text-2xl font-black text-slate-800">診断結果</h2>
            </header>
            
            <div id="result-content" class="space-y-6">
                <!-- JS will inject result content here -->
            </div>
            
            <!-- Message -->
            <div class="mt-8 p-6 bg-amber-50 rounded-3xl text-left border border-amber-100 shadow-inner">
                <p class="text-xs text-amber-900 leading-relaxed font-medium">
                    <span class="text-sm font-bold text-amber-600 flex items-center mb-2">
                        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1a1 1 0 112 0v1a1 1 0 11-2 0zM13.536 14.95a1 1 0 010-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM5.05 13.536a1 1 0 011.414 0l.707.707a1 1 0 11-1.414 1.414l-.707-.707a1 1 0 010-1.414z"></path></svg>
                        アドバイス
                    </span>
                    これは今のあなたの“傾向”です。医療の道は、学びと出会いで大きく広がります。この結果を一つのヒントにして、ワクワクする未来を想像してみてくださいね。
                </p>
            </div>

            <!-- CTA -->
            <div class="mt-10 space-y-4">
                <div class="p-1 bg-gradient-to-r from-orange-400 to-pink-500 rounded-[1.5rem] shadow-lg shadow-orange-100 transition-transform hover:scale-[1.02]">
                    <a href="https://www.hmc.ac.jp/opencampus" target="_blank" class="block w-full bg-white hover:bg-orange-50 text-slate-800 font-bold py-4 rounded-[1.2rem] flex items-center justify-center">
                        <span class="mr-2">🗓️</span> オープンキャンパスで体験する
                    </a>
                </div>
                <button onclick="location.reload()" class="w-full py-4 text-slate-400 text-xs font-bold hover:text-slate-600 transition-colors tracking-widest">
                    RETAKE QUIZ
                </button>
            </div>
        </div>
    </div>

    <script>
        const svgs = {
            owl: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="char-svg w-full h-full"><defs><linearGradient id="owlGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#92400e;stop-opacity:1" /><stop offset="100%" style="stop-color:#78350f;stop-opacity:1" /></linearGradient></defs><circle cx="100" cy="100" r="90" fill="#f0f9ff"/><path d="M40,70 Q100,20 160,70 L160,160 Q100,190 40,160 Z" fill="url(#owlGrad)"/><path d="M40,70 Q100,20 160,70 L160,110 Q100,130 40,110 Z" fill="#b45309" opacity="0.3"/><circle cx="70" cy="90" r="25" fill="white"/><circle cx="130" cy="90" r="25" fill="white"/><circle cx="70" cy="90" r="12" fill="#1e3a8a"/><circle cx="130" cy="90" r="12" fill="#1e3a8a"/><circle cx="70" cy="90" r="28" stroke="#3b82f6" stroke-width="4" fill="none"/><circle cx="130" cy="90" r="28" stroke="#3b82f6" stroke-width="4" fill="none"/><path d="M98,90 L102,90" stroke="#3b82f6" stroke-width="4"/><path d="M90,115 L100,130 L110,115" fill="#f59e0b"/></svg>`,
            rabbit: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="char-svg w-full h-full"><circle cx="100" cy="100" r="90" fill="#fff1f2"/><ellipse cx="70" cy="50" rx="20" ry="50" fill="white" stroke="#fecdd3" stroke-width="3"/><ellipse cx="130" cy="50" rx="20" ry="50" fill="white" stroke="#fecdd3" stroke-width="3"/><circle cx="100" cy="120" r="50" fill="white"/><circle cx="85" cy="110" r="6" fill="#334155"/><circle cx="115" cy="110" r="6" fill="#334155"/><path d="M95,120 Q100,128 105,120" stroke="#fb7185" stroke-width="3" fill="none"/><rect x="120" y="130" width="35" height="45" rx="4" fill="#fef08a" stroke="#d97706" stroke-width="2" transform="rotate(-10 140 155)"/></svg>`,
            wolf: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="char-svg w-full h-full"><circle cx="100" cy="100" r="90" fill="#f8fafc"/><path d="M50,150 L50,80 L90,120 Z" fill="#94a3b8"/><path d="M150,150 L150,80 L110,120 Z" fill="#94a3b8"/><circle cx="100" cy="120" r="50" fill="#cbd5e1"/><path d="M80,80 L60,30 L100,70 Z" fill="#475569"/><path d="M120,80 L140,30 L100,70 Z" fill="#475569"/><circle cx="85" cy="115" r="5" fill="#1e293b"/><circle cx="115" cy="115" r="5" fill="#1e293b"/><rect x="135" y="90" width="15" height="35" fill="#ef4444" rx="2"/></svg>`,
            elephant: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="char-svg w-full h-full"><circle cx="100" cy="100" r="90" fill="#f0fdf4"/><circle cx="60" cy="90" r="30" fill="#cbd5e1"/><circle cx="140" cy="90" r="30" fill="#cbd5e1"/><circle cx="100" cy="100" r="45" fill="#e2e8f0"/><circle cx="85" cy="95" r="5" fill="#334155"/><circle cx="115" cy="95" r="5" fill="#334155"/><path d="M90,110 Q100,160 120,130" stroke="#e2e8f0" stroke-width="12" fill="none" stroke-linecap="round"/><rect x="135" y="135" width="40" height="30" fill="white" stroke="#334155" stroke-width="2" transform="rotate(-5)"/></svg>`
        };

        const questions = [
            { q: "新しい知識を学んだり、仕組みを分析するのが好きだ", target: "A" },
            { q: "相手が言葉にしなくても、何をしてほしいか気づける方だ", target: "B" },
            { q: "ピンチの時ほど、頭が冷えてテキパキ動ける自信がある", target: "C" },
            { q: "地道な作業も、誰かの笑顔のためなら続けられる", target: "D" },
            { q: "将来は、専門スキルを身につけて長く働きたい", target: "ALL" },
            { q: "パズルや機械の修理など、論理的に解くのが得意だ", target: "A" },
            { q: "人と話す時は、話し方だけでなく表情もよく見ている", target: "B" },
            { q: "運動会やイベントなど、本番の緊張感が好きなタイプだ", target: "C" },
            { q: "リハビリのように、少しずつの変化を一緒に喜びたい", target: "D" },
            { q: "チームで何かを成し遂げる時にやりがいを感じる", target: "ALL" }
        ];

        const types = {
            A: { title: "スマート・フクロウ", sub: "知識を探求するエンジニア気質", jobs: "臨床工学技士 / 言語聴覚士", color: "#0ea5e9", svg: svgs.owl, desc: "「なぜ？」を大切にするあなたは、高い専門技術で命を支えるプロフェッショナル。機械や言葉の仕組みを解き明かす仕事で才能を発揮します。" },
            B: { title: "ハート・ラビット", sub: "心に寄り添うカウンセラー気質", jobs: "言語聴覚士 / 作業療法士", color: "#f43f5e", svg: svgs.rabbit, desc: "あなたの最大の武器は「共感力」。不安を抱える人の心を解きほぐし、前向きな一歩をサポートするリハビリの仕事がぴったりです。" },
            C: { title: "アクション・ウルフ", sub: "最前線を守るレスキュー気質", jobs: "救急救命士 / 臨床工学技士", color: "#f97316", svg: svgs.wolf, desc: "決断力とスピード感を備えたあなたは、一分一秒を争う現場のヒーロー。高い緊張感の中でも冷静に命を救う姿がイメージできます。" },
            D: { title: "ステディ・エレファント", sub: "日常を支える伴走者気質", jobs: "作業療法士 / 言語聴覚士", color: "#10b981", svg: svgs.elephant, desc: "「根気強さ」こそがあなたの強み。患者さんの生活に深く関わり、人生を再構築していく。長くじっくり向き合う仕事で信頼される存在になります。" }
        };

        let currentIdx = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0 };
        let history = [];

        function startQuiz() {
            currentIdx = 0;
            scores = { A: 0, B: 0, C: 0, D: 0 };
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-number').innerText = `Q.${(currentIdx + 1).toString().padStart(2, '0')} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress').style.width = `${(currentIdx / questions.length) * 100}%`;
        }

        function handleAnswer(val) {
            const target = questions[currentIdx].target;
            history.push({ target, val });

            if (target === "ALL") {
                Object.keys(scores).forEach(k => scores[k] += val);
            } else {
                scores[target] += val;
            }

            currentIdx++;
            if (currentIdx < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function goBack() {
            if (currentIdx === 0) {
                location.reload();
                return;
            }
            currentIdx--;
            const last = history.pop();
            if (last.target === "ALL") {
                Object.keys(scores).forEach(k => scores[k] -= last.val);
            } else {
                scores[last.target] -= last.val;
            }
            renderQuestion();
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('progress').style.width = '100%';

            const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
            const max = scores[sorted[0]];
            const winners = sorted.filter(k => scores[k] === max);

            let html = "";
            winners.slice(0, 1).forEach(w => { // 同率の場合は1つ目をメインに（必要に応じループへ）
                const type = types[w];
                html = `
                    <div class="result-card p-8 rounded-[2.5rem] bg-white border-2 fade-in" style="border-color: ${type.color}33">
                        <div class="w-40 h-40 mx-auto mb-6">
                            ${type.svg}
                        </div>
                        <div class="mb-4">
                            <span class="text-[10px] font-black uppercase tracking-[0.2em]" style="color: ${type.color}">${type.sub}</span>
                            <h3 class="text-3xl font-black mt-1" style="color: ${type.color}">${type.title}</h3>
                        </div>
                        <p class="text-slate-600 text-sm leading-relaxed mb-6 px-2">${type.desc}</p>
                        <div class="bg-slate-50 p-4 rounded-2xl text-left">
                            <span class="text-[10px] font-bold text-slate-400 block mb-2 tracking-widest uppercase">Best Career Match</span>
                            <div class="text-slate-800 font-bold text-sm">${type.jobs}</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('result-content').innerHTML = html;
        }
    </script>
</body>
</html>
